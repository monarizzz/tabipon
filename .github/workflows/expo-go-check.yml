name: Expo Go check

# App Store の Expo Go と frontend の Expo SDK のずれ、および依存のバージョンのずれを
# 毎日検出し、ずれていれば Issue を立てる（同じ種類の Issue が開いていれば更新する）。
# ストアや Expo 側の更新はリポジトリの変更と無関係に起きるため、PR の CI ではなく定期実行にする。
# 判定と Issue の本文は .github/scripts/check-expo-go.mjs にある。
on:
  schedule:
    # 毎日 0:00 UTC（日本時間 9:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Expo Go and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # expo install --check がインストール済みの expo と各パッケージのバージョンを読むため
      - run: pnpm install --frozen-lockfile
      - name: Check versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/check-expo-go.mjs
