name: PR-test

on: [pull_request]

# 同一 PR に連続で push した場合、古い run を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 依存は pnpm のストアを setup-node でキャッシュし、node_modules へはストアから展開する。
# pnpm-lock.yaml は OS に依存しないため、--frozen-lockfile で lock と package.json の不一致を検出できる。
# pnpm のバージョンはルートの package.json の packageManager から pnpm/action-setup が読む。
#
# ジョブ間に依存関係は作らない。install 専用ジョブを前段に置くと、そこが落ちたときに
# 後続が全てスキップされ「どこで落ちたか分からない」状態になるため。
#
# モノレポなので、run はすべて frontend/ で実行する(pnpm install は workspace 全体に効く)。
# backend/ 向けのジョブは #98 (BE 廃止) で不要になるため作らない。
defaults:
  run:
    working-directory: frontend

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  # Storybook のストーリーを portable stories (composeStories) として Jest から
  # 描画するスモークテスト。端末もブラウザも要らないので他の検査と同じ
  # ubuntu ランナーで完結する。blog で使っている @storybook/addon-vitest +
  # Playwright は Web 版 Storybook 前提で、React Native では使えない
  storybook:
    name: Storybook stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --ci
