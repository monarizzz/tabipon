packages:
  - frontend

allowBuilds:
  '@parcel/watcher': false
  '@shopify/react-native-skia': true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.16'
  - babel-preset-expo@58.0.21
  - expo@58.0.20
  - expo-router@58.0.27

nodeLinker: hoisted

overrides:
  expo-modules-core: ~58.0.0
